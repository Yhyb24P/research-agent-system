name: control-plane-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install from committed lock
        run: uv sync --frozen
      - name: Generate lock-derived SBOM
        run: |
          uv run python scripts/lock_sbom.py --output /tmp/dq00-python-sbom.json
          uv run python -c 'import json; p=json.load(open("/tmp/dq00-python-sbom.json")); assert p["bomFormat"] == "CycloneDX" and p["components"]'
      - name: Test
        run: uv run pytest -q
      - name: Type check
        run: uv run mypy src tests
      - name: Migration head
        run: uv run alembic upgrade head
      - name: Diff hygiene
        run: git diff --check
