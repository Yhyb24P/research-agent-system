[project]
name = "research-agent-system"
version = "1.0.0rc83.dev0"
description = "Agent collaboration plane and trusted control plane for research workflows"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
a2a = [
  "a2a-sdk[http-server]>=1.0,<2",
  "uvicorn>=0.30,<1",
]
langgraph-agent = [
  "langgraph>=1.2,<2",
]
qualification = [
  "jsonschema>=4.23,<5",
]
tui = [
  "textual>=6,<7",
]

[project.scripts]
research = "researchd.client.cli:entrypoint"
research-aweswitch-agent = "researchd.bridge.aweswitch_agent:entrypoint"
research-coder-agent = "researchd.pilot.coder_agent:entrypoint"
researchctl = "researchd.cli.main:entrypoint"
researchd = "researchd.daemon.cli:entrypoint"

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "types-protobuf>=6.30,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchd"]

# The sdist keeps hatchling's default selection (every version-controlled
# file), which already ships src/researchd/storage/migrations/** including
# env.py, script.py.mako and all versions/*.py.  An explicit `include`
# filter here would replace that selection and strip the source tree.

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true
