[project]
name = "research-agent-system"
version = "0.1.0"
description = "Agent collaboration plane and trusted control plane for research workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
a2a = [
  "a2a-sdk>=1.0,<2",
]

[project.scripts]
researchctl = "researchd.cli.main:entrypoint"

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "types-protobuf>=6.30,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchd"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true
